name: Build and release Aseprite (Reliable Version)

on:
  workflow_dispatch:

jobs:
  build-aseprite:
    name: Build Aseprite on Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chocolatey
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        shell: powershell

      - name: Install build dependencies
        run: |
          choco install -y cmake ninja
        shell: powershell

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
        shell: powershell

      - name: Find Visual Studio installation
        id: find_vs
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          
          if (-not $vsPath) {
            Write-Error "Visual Studio installation not found"
            exit 1
          }
          
          Write-Host "Found Visual Studio at: $vsPath"
          
          $vcVarsPath = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          
          if (-not (Test-Path $vcVarsPath)) {
            Write-Error "vcvarsall.bat not found at $vcVarsPath"
            exit 1
          }
          
          Write-Host "Found vcvarsall.bat at: $vcVarsPath"
          
          echo "vs_path=$vsPath" >> $env:GITHUB_OUTPUT
          echo "vcvars_path=$vcVarsPath" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Prepare build directory
        run: |
          mkdir -p aseprite_build
          cd aseprite_build
          
          # Clone Aseprite
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite
          
          # Download Skia
          cd aseprite
          Invoke-WebRequest -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" -OutFile "Skia-Windows-Release-x64.zip"
          
          # Extract Skia
          Expand-Archive -Path "Skia-Windows-Release-x64.zip" -DestinationPath "skia" -Force
          
          # Create build directory
          mkdir -p build
        shell: powershell

      - name: Build Aseprite with vcvarsall
        run: |
          @echo off
          setlocal enabledelayedexpansion
          
          echo === Starting Aseprite build ===
          
          :: Set paths
          set "VCVARS_PATH=${{ steps.find_vs.outputs.vcvars_path }}"
          set "BUILD_DIR=%GITHUB_WORKSPACE%\aseprite_build\aseprite\build"
          set "SOURCE_DIR=%GITHUB_WORKSPACE%\aseprite_build\aseprite"
          
          echo VCVARS_PATH: !VCVARS_PATH!
          echo BUILD_DIR: !BUILD_DIR!
          echo SOURCE_DIR: !SOURCE_DIR!
          
          :: Navigate to build directory
          cd /d "!BUILD_DIR!"
          
          :: Run vcvarsall and build in the same command
          echo Calling vcvarsall.bat and starting build...
          call "!VCVARS_PATH!" x64 10.0.26100.0 && (
            echo Environment variables set successfully
            
            :: Run CMake
            echo Running CMake...
            cmake -G Ninja ^
              -DCMAKE_BUILD_TYPE=Release ^
              -DENABLE_TESTS=OFF ^
              -DENABLE_SCRIPTING=ON ^
              -DENABLE_CCACHE=OFF ^
              -DLAF_BACKEND=skia ^
              -DSKIA_DIR="!SOURCE_DIR!\skia" ^
              -DSKIA_LIBRARY_DIR="!SOURCE_DIR!\skia\out\Release-x64" ^
              -DOPENSSL_USE_STATIC_LIBS=ON ^
              "!SOURCE_DIR!"
            
            if %errorlevel% neq 0 (
              echo ERROR: CMake failed with exit code %errorlevel%
              exit /b %errorlevel%
            )
            
            :: Build with Ninja
            echo Running Ninja build...
            ninja
            
            if %errorlevel% neq 0 (
              echo ERROR: Ninja build failed with exit code %errorlevel%
              exit /b %errorlevel%
            )
            
            echo Build completed successfully
          ) || (
            echo ERROR: Failed to set up build environment
            exit /b 1
          )
          
          :: Verify build output
          if exist "bin\aseprite.exe" (
            echo SUCCESS: Aseprite executable found at bin\aseprite.exe
            dir bin\aseprite.exe
          ) else (
            echo ERROR: Aseprite executable not found
            exit /b 1
          )
          
          :: Create portable package
          cd bin
          echo Creating portable package...
          echo This file is here so Aseprite behaves as a portable program > aseprite.ini
          
          :: Create zip archive
          powershell Compress-Archive -Path * -DestinationPath "Aseprite-Windows.zip" -Force
          
          if exist "Aseprite-Windows.zip" (
            echo SUCCESS: Created Aseprite-Windows.zip
            dir Aseprite-Windows.zip
          ) else (
            echo ERROR: Failed to create zip archive
            exit /b 1
          )
          
          endlocal
        shell: cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Build
          path: aseprite_build/aseprite/build/bin/Aseprite-Windows.zip
          retention-days: 7

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: aseprite-build-${{ github.run_id }}
          release_name: Aseprite Build ${{ github.run_id }}
          draft: false
          prerelease: true

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: aseprite_build/aseprite/build/bin/Aseprite-Windows.zip
          asset_name: Aseprite-Windows.zip
          asset_content_type: application/zip
